<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Sifat Huruf Hijaiyah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600&display=swap');
        .arabic { font-family: 'Amiri', serif; }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card-back { transform: rotateY(180deg); }
        .trait-opt { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 font-['Inter'] min-h-screen">

<div id="app" class="max-w-md mx-auto p-4">
    <header class="text-center py-4">
        <h1 class="text-2xl font-bold text-emerald-700">Sifat Huruf Hijaiyah</h1>
    </header>

    <div id="menu" class="space-y-4 mt-10">
        <button onclick="startMode('study')" class="w-full bg-white border-2 border-emerald-500 p-6 rounded-2xl shadow-sm flex items-center justify-between">
            <div class="text-left">
                <span class="block text-lg font-bold text-emerald-700">Mode Belajar</span>
                <span class="text-sm text-slate-500">Pelajari sifat huruf</span>
            </div>
            <span class="material-icons text-emerald-500">menu_book</span>
        </button>
        <button onclick="startMode('play')" class="w-full bg-emerald-600 p-6 rounded-2xl shadow-sm flex items-center justify-between text-white">
            <div class="text-left">
                <span class="block text-lg font-bold">Mode Bermain</span>
                <span class="text-sm text-emerald-100">Uji hafalanmu</span>
            </div>
            <span class="material-icons">extension</span>
        </button>
    </div>

    <div id="game-container" class="hidden">
        <div class="flex justify-between items-center mb-4">
            <button onclick="backToMenu()" class="text-slate-400 p-2"><span class="material-icons">arrow_back</span></button>
            <div id="progress" class="text-sm font-semibold text-slate-400 font-mono">1 / 28</div>
            <div id="score-display" class="hidden text-emerald-600 font-bold">Skor: 0</div>
        </div>

        <div class="card-flip w-full h-48 relative mb-6" id="flashcard">
            <div class="card-inner w-full h-full relative shadow-lg rounded-2xl" id="card-inner">
                <div class="card-front bg-white flex items-center justify-center rounded-2xl border-2 border-slate-100" onclick="handleCardClick()">
                    <span id="char-display" class="arabic text-7xl text-slate-800">أ</span>
                </div>
                <div class="card-back bg-emerald-50 flex flex-col items-center justify-center rounded-2xl border-2 border-emerald-200 p-4 overflow-y-auto" onclick="handleCardClick()">
                    <h3 class="text-emerald-800 font-bold text-sm mb-2 underline">Sifat Benar:</h3>
                    <div id="traits-list" class="flex flex-wrap justify-center gap-1.5"></div>
                </div>
            </div>
        </div>

        <div id="quiz-controls" class="mt-2 hidden">
            <div id="options-grid" class="space-y-3">
                </div>
            <button onclick="checkAnswer()" id="submit-btn" class="w-full mt-6 bg-emerald-600 text-white py-3.5 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">Periksa Jawaban</button>
        </div>

        <div id="nav-controls" class="mt-6 flex gap-4">
            <button onclick="prevCard()" class="flex-1 bg-white border border-slate-200 py-3 rounded-xl">Kembali</button>
            <button onclick="nextCard()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl shadow-md">Lanjut</button>
        </div>
    </div>
</div>

<script>
    // Data tetap sama
    const dataHuruf = [
        { h: 'أ', s: ['Jahr', 'Syiddah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'ب', s: ['Jahr', 'Syiddah', 'Istifal', 'Infitah', 'Idzlaq', 'Qalqalah'] },
        { h: 'ت', s: ['Hams', 'Syiddah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'ث', s: ['Hams', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'ج', s: ['Jahr', 'Syiddah', 'Istifal', 'Infitah', 'Ishmat', 'Qalqalah'] },
        { h: 'ح', s: ['Hams', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'خ', s: ['Hams', 'Rakhawah', 'Isti\'la', 'Infitah', 'Ishmat'] },
        { h: 'د', s: ['Jahr', 'Syiddah', 'Istifal', 'Infitah', 'Ishmat', 'Qalqalah'] },
        { h: 'ذ', s: ['Jahr', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'ر', s: ['Jahr', 'Tawassuth', 'Istifal', 'Infitah', 'Idzlaq', 'Inhiraf', 'Takrir'] },
        { h: 'ز', s: ['Jahr', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat', 'Shafir'] },
        { h: 'س', s: ['Hams', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat', 'Shafir'] },
        { h: 'ش', s: ['Hams', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat', 'Tafasysyi'] },
        { h: 'ص', s: ['Hams', 'Rakhawah', 'Isti\'la', 'Ithbaq', 'Ishmat', 'Shafir'] },
        { h: 'ض', s: ['Jahr', 'Rakhawah', 'Isti\'la', 'Ithbaq', 'Ishmat', 'Istitholah'] },
        { h: 'ط', s: ['Jahr', 'Syiddah', 'Isti\'la', 'Ithbaq', 'Ishmat', 'Qalqalah'] },
        { h: 'ظ', s: ['Jahr', 'Rakhawah', 'Isti\'la', 'Ithbaq', 'Ishmat'] },
        { h: 'ع', s: ['Jahr', 'Tawassuth', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'غ', s: ['Jahr', 'Rakhawah', 'Isti\'la', 'Infitah', 'Ishmat'] },
        { h: 'ف', s: ['Hams', 'Rakhawah', 'Istifal', 'Infitah', 'Idzlaq'] },
        { h: 'ق', s: ['Jahr', 'Syiddah', 'Isti\'la', 'Infitah', 'Ishmat', 'Qalqalah'] },
        { h: 'ك', s: ['Hams', 'Syiddah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'ل', s: ['Jahr', 'Tawassuth', 'Istifal', 'Infitah', 'Idzlaq', 'Inhiraf'] },
        { h: 'م', s: ['Jahr', 'Tawassuth', 'Istifal', 'Infitah', 'Idzlaq'] },
        { h: 'ن', s: ['Jahr', 'Tawassuth', 'Istifal', 'Infitah', 'Idzlaq'] },
        { h: 'و', s: ['Jahr', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat', 'Lin'] },
        { h: 'ه', s: ['Hams', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat'] },
        { h: 'ي', s: ['Jahr', 'Rakhawah', 'Istifal', 'Infitah', 'Ishmat', 'Lin'] }
    ];

    const traitGroups = [
        { name: 'hamsjahr', traits: ['Hams', 'Jahr'] },
        { name: 'syiddah', traits: ['Syiddah', 'Tawassuth', 'Rakhawah'] },
        { name: 'istila', traits: ["Isti'la", "Istifal"] }, // Menggunakan double quote agar single quote aman
        { name: 'ithbaq', traits: ['Ithbaq', 'Infitah'] },
        { name: 'idzlaq', traits: ['Idzlaq', 'Ishmat'] },
        { name: 'extra', traits: ['Shafir', 'Qalqalah', 'Lin', 'Inhiraf', 'Takrir', 'Tafasysyi', 'Istitholah'] }
    ];

    let currentIndex = 0;
    let currentMode = 'study';
    let selectedTraits = [];
    let score = 0;

    function startMode(mode) {
        currentMode = mode;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        if (mode === 'play') {
            document.getElementById('quiz-controls').classList.remove('hidden');
            document.getElementById('nav-controls').classList.add('hidden');
            document.getElementById('score-display').classList.remove('hidden');
            score = 0;
            updateScore();
            dataHuruf.sort(() => Math.random() - 0.5);
        } else {
            document.getElementById('quiz-controls').classList.add('hidden');
            document.getElementById('nav-controls').classList.remove('hidden');
        }
        renderCard();
    }

    function renderCard() {
        const item = dataHuruf[currentIndex];
        document.getElementById('char-display').innerText = item.h;
        document.getElementById('progress').innerText = `${currentIndex + 1} / ${dataHuruf.length}`;
        
        const traitsList = document.getElementById('traits-list');
        traitsList.innerHTML = item.s.map(s => `<span class="bg-emerald-200 text-emerald-800 px-3 py-1 rounded-full text-[10px] font-bold">${s}</span>`).join('');

        if (currentMode === 'play') {
            const optionsGrid = document.getElementById('options-grid');
            selectedTraits = [];
            let htmlContent = '';
            
            traitGroups.forEach((group) => {
                htmlContent += `<div class="flex flex-wrap gap-2 justify-center border-b border-slate-100 pb-2">`;
                group.traits.forEach(t => {
                    // MENGGUNAKAN JSON.stringify UNTUK MENGHINDARI MASALAH PETIK PADA ISTI'LA
                    htmlContent += `
                        <button onclick='toggleTrait(${JSON.stringify(t)}, this, "${group.name}")' 
                            class="trait-opt border border-slate-200 px-1 py-2 rounded-lg text-[11px] bg-white transition-all flex-1 min-w-[75px] font-medium text-slate-700">
                            ${t}
                        </button>`;
                });
                htmlContent += `</div>`;
            });
            optionsGrid.innerHTML = htmlContent;
            document.getElementById('card-inner').classList.remove('flipped');
            document.getElementById('submit-btn').innerText = "Periksa Jawaban";
            document.getElementById('submit-btn').onclick = checkAnswer;
        }
    }

    function toggleTrait(trait, el, groupName) {
        const group = traitGroups.find(g => g.name === groupName);
        
        if (selectedTraits.includes(trait)) {
            // Hapus jika sudah terpilih
            selectedTraits = selectedTraits.filter(t => t !== trait);
            el.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
            el.classList.add('bg-white', 'text-slate-700');
        } else {
            // Jika grup berlawanan (bukan 'extra'), matikan sibling-nya
            if (groupName !== 'extra') {
                const buttons = el.parentElement.querySelectorAll('button');
                buttons.forEach(btn => {
                    btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
                    btn.classList.add('bg-white', 'text-slate-700');
                });
                // Hapus semua anggota grup ini dari array pilihan
                selectedTraits = selectedTraits.filter(t => !group.traits.includes(t));
            }
            
            // Tambahkan pilihan baru
            selectedTraits.push(trait);
            el.classList.remove('bg-white', 'text-slate-700');
            el.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600');
        }
    }

    function checkAnswer() {
        const correct = [...dataHuruf[currentIndex].s].sort();
        const user = [...selectedTraits].sort();
        const isCorrect = JSON.stringify(correct) === JSON.stringify(user);
        
        document.getElementById('card-inner').classList.add('flipped');
        if (isCorrect) { 
            score += 10; 
            updateScore(); 
            alert("Maa syaa Allah! Benar."); 
        } else { 
            alert("Kurang tepat. Periksa jawaban benar di balik kartu."); 
        }
        
        document.getElementById('submit-btn').innerText = "Huruf Selanjutnya";
        document.getElementById('submit-btn').onclick = nextCard;
    }

    function updateScore() { document.getElementById('score-display').innerText = `Skor: ${score}`; }
    function backToMenu() { location.reload(); } // Cara termudah reset state
    function handleCardClick() { if (currentMode === 'study') document.getElementById('card-inner').classList.toggle('flipped'); }
    
    function nextCard() {
        if (currentIndex < dataHuruf.length - 1) {
            currentIndex++;
            document.getElementById('card-inner').classList.remove('flipped');
            setTimeout(renderCard, 300);
        } else { 
            alert(`Selesai! Skor Akhir: ${score}`); 
            backToMenu(); 
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            document.getElementById('card-inner').classList.remove('flipped');
            setTimeout(renderCard, 300);
        }
    }
</script>
</body>
</html>
