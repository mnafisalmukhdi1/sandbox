<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Sifat Huruf Hijaiyah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600&display=swap');
        .arabic { font-family: 'Amiri', serif; }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card-back { transform: rotateY(180deg); }
        /* Memastikan area klik bersih */
        .trait-opt { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 font-['Inter'] min-h-screen">

<div id="app" class="max-w-md mx-auto p-4">
    <header class="text-center py-6">
        <h1 class="text-2xl font-bold text-emerald-700">Sifat Huruf Hijaiyah</h1>
        <p class="text-slate-500 text-sm">Belajar & Uji Pemahaman</p>
    </header>

    <div id="menu" class="space-y-4">
        <button onclick="startMode('study')" class="w-full bg-white border-2 border-emerald-500 p-6 rounded-2xl shadow-sm hover:bg-emerald-50 transition flex items-center justify-between">
            <div class="text-left">
                <span class="block text-lg font-bold text-emerald-700">Mode Belajar</span>
                <span class="text-sm text-slate-500">Lihat huruf dan pelajari sifatnya</span>
            </div>
            <span class="material-icons text-emerald-500">menu_book</span>
        </button>
        <button onclick="startMode('play')" class="w-full bg-emerald-600 p-6 rounded-2xl shadow-sm hover:bg-emerald-700 transition flex items-center justify-between text-white">
            <div class="text-left">
                <span class="block text-lg font-bold">Mode Bermain</span>
                <span class="text-sm text-emerald-100">Pilih sifat yang tepat</span>
            </div>
            <span class="material-icons">extension</span>
        </button>
    </div>

    <div id="game-container" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <button onclick="backToMenu()" class="text-slate-400 hover:text-slate-600">
                <span class="material-icons">arrow_back</span>
            </button>
            <div id="progress" class="text-sm font-semibold text-slate-400 font-mono">1 / 28</div>
            <div id="score-display" class="hidden text-emerald-600 font-bold">Skor: 0</div>
        </div>

        <div class="card-flip w-full h-64 relative mb-4" id="flashcard">
            <div class="card-inner w-full h-full relative shadow-xl rounded-3xl" id="card-inner">
                <div class="card-front bg-white flex items-center justify-center rounded-3xl border-2 border-slate-100" onclick="handleCardClick()">
                    <span id="char-display" class="arabic text-8xl text-slate-800">أ</span>
                </div>
                <div class="card-back bg-emerald-50 flex flex-col items-center justify-center rounded-3xl border-2 border-emerald-200 p-6 overflow-y-auto" onclick="handleCardClick()">
                    <h3 class="text-emerald-800 font-bold mb-3 underline">Sifat Benar:</h3>
                    <div id="traits-list" class="flex flex-wrap justify-center gap-2"></div>
                </div>
            </div>
        </div>

        <div id="quiz-controls" class="mt-6 hidden">
            <div id="options-grid" class="space-y-4">
                </div>
            <button onclick="checkAnswer()" id="submit-btn" class="w-full mt-8 bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">Periksa Jawaban</button>
        </div>

        <div id="nav-controls" class="mt-8 flex gap-4">
            <button onclick="prevCard()" class="flex-1 bg-white border border-slate-200 py-3 rounded-xl hover:bg-slate-50 transition">Kembali</button>
            <button onclick="nextCard()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl shadow-lg hover:bg-emerald-700 transition">Lanjut</button>
        </div>
    </div>
</div>
