<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munaqasyah Digital - Ghorib & Fawatihussuwar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .arabic { font-family: 'Amiri', serif; direction: rtl; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-6 shadow-md text-center sticky top-0 z-10">
        <h1 class="text-2xl font-bold">Ujian Munaqasyah Lisan</h1>
        <p class="text-sm opacity-90">Ghorib & Fawatihussuwar</p>
        
        <!-- Toggle Mode -->
        <div class="flex justify-center mt-4">
            <div class="bg-emerald-800 p-1 rounded-lg flex space-x-2">
                <button id="btnBelajar" onclick="switchMode('belajar')" class="px-4 py-1 rounded-md bg-white text-emerald-800 font-semibold transition">Mode Belajar</button>
                <button id="btnLatihan" onclick="switchMode('latihan')" class="px-4 py-1 rounded-md text-white font-semibold transition">Mode Latihan</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <div id="grid-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Box akan di-generate oleh JavaScript -->
        </div>
    </main>

    <!-- Feedback UI -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-bold text-emerald-700 mb-2">Jawaban</h3>
            <div id="modalArabic" class="arabic text-3xl mb-4 text-center"></div>
            <p id="modalContent" class="text-gray-700 leading-relaxed italic"></p>
            
            <!-- Voice Recognition UI -->
            <div id="voiceSection" class="hidden mt-6 border-t pt-4 text-center">
                <div id="statusPulse" class="w-12 h-12 bg-red-500 rounded-full mx-auto mb-2 animate-pulse hidden"></div>
                <p id="voiceStatus" class="text-sm font-semibold text-red-600 mb-2 italic">Mendengarkan...</p>
                <div id="resultText" class="text-sm bg-gray-100 p-3 rounded-lg min-h-[50px] mb-4"></div>
            </div>

            <button onclick="closeModal()" class="w-full mt-6 bg-emerald-600 text-white py-2 rounded-xl font-bold hover:bg-emerald-700 transition">Tutup</button>
        </div>
    </div>

    <script>
        // Data Soal (Bisa kamu lengkapi sampai 43)
        const dataSoal = [
            {
                id: 1,
                teks: "لَكِنَّا هُوَ اللَّهُ رَبِّي",
                penjelasan: "Shifrul Mustathil adalah tanda bulat lonjong, jika washol dibaca pendek dan jika waqof dibaca panjang 2 harakat.",
                fullAnswer: "Ada pelajaran Shifrul Mustathil, di lafadz Laakinna Huwallahu Rabbi. Shifrul Mustathil adalah tanda bulat lonjong, jika washol dibaca pendek dan jika waqof dibaca panjang dua harakat. Jika washol dibaca laakinna huwallahu rabbi, jika waqof dibaca laakinnaa."
            },
            {
                id: 2,
                teks: "بِمُصَيْطِرٍ",
                penjelasan: "Sod boleh dibaca Sod (tetap) atau dibaca Sin.",
                fullAnswer: "Di lafadz Bimushaithirin, huruf Sod boleh dibaca tetap Sod atau dibaca Sin."
            },
            {
                id: 4,
                teks: "مَجْرَىٰهَا",
                penjelasan: "Imalah: Memiringkan bunyi fathah ke arah kasroh (seperti bunyi 'e' dalam sate).",
                fullAnswer: "Ada pelajaran Imalah di lafadz Majreha. Imalah artinya memiringkan bunyi fathah ke arah kasroh."
            }
            // Tambahkan 3-43 di sini...
        ];

        let currentMode = 'belajar';
        const recognition = window.SpeechRecognition || window.webkitSpeechRecognition ? new (window.SpeechRecognition || window.webkitSpeechRecognition)() : null;
        
        if (recognition) {
            recognition.lang = 'id-ID';
            recognition.interimResults = true;
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnBelajar').className = mode === 'belajar' ? 'px-4 py-1 rounded-md bg-white text-emerald-800 font-semibold transition' : 'px-4 py-1 rounded-md text-white font-semibold transition';
            document.getElementById('btnLatihan').className = mode === 'latihan' ? 'px-4 py-1 rounded-md bg-white text-emerald-800 font-semibold transition' : 'px-4 py-1 rounded-md text-white font-semibold transition';
        }

        function renderGrid() {
            const container = document.getElementById('grid-container');
            dataSoal.forEach(soal => {
                const box = document.createElement('div');
                box.className = "bg-white border-2 border-emerald-100 p-4 rounded-xl shadow-sm hover:shadow-md hover:border-emerald-500 cursor-pointer transition flex flex-col items-center justify-center space-y-2 group";
                box.onclick = () => handleBoxClick(soal);
                box.innerHTML = `
                    <span class="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded-full group-hover:bg-emerald-500 group-hover:text-white transition">${soal.id}</span>
                    <span class="arabic text-xl text-slate-800">${soal.teks}</span>
                `;
                container.appendChild(box);
            });
        }

        function handleBoxClick(soal) {
            const modal = document.getElementById('modal');
            const modalArabic = document.getElementById('modalArabic');
            const modalContent = document.getElementById('modalContent');
            const voiceSection = document.getElementById('voiceSection');

            modal.classList.remove('hidden');
            modalArabic.innerText = soal.teks;

            if (currentMode === 'belajar') {
                document.getElementById('modalTitle').innerText = "Mode Belajar";
                modalContent.innerText = soal.penjelasan;
                voiceSection.classList.add('hidden');
            } else {
                document.getElementById('modalTitle').innerText = "Mode Latihan (Bicara Sekarang)";
                modalContent.innerText = "Katakan jawaban lengkapnya...";
                voiceSection.classList.remove('hidden');
                startListening(soal);
            }
        }

        function startListening(soal) {
            if (!recognition) {
                alert("Browser tidak mendukung Voice Recognition.");
                return;
            }

            const resultDiv = document.getElementById('resultText');
            const statusPulse = document.getElementById('statusPulse');
            resultDiv.innerText = "";
            statusPulse.classList.remove('hidden');

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                resultDiv.innerText = `Kamu berkata: "${transcript}"`;
                
                // Logika sederhana mengecek kemiripan (bisa dikembangkan)
                if (event.results[0].isFinal) {
                    statusPulse.classList.add('hidden');
                    document.getElementById('voiceStatus').innerText = "Selesai mendengarkan.";
                }
            };

            recognition.onerror = () => {
                statusPulse.classList.add('hidden');
                document.getElementById('voiceStatus').innerText = "Gagal mengenali suara.";
            };
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            if(recognition) recognition.stop();
        }

        renderGrid();
    </script>
</body>
</html>
