// Fungsi Kalkulasi Kemiripan (Levenshtein Distance)
function getSimilarity(s1, s2) {
    let longer = s1.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
    let shorter = s2.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
    
    if (longer.length < shorter.length) { [longer, shorter] = [shorter, longer]; }
    let longerLength = longer.length;
    if (longerLength === 0) return 100;

    const distance = (function(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
        for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; }
                else {
                    matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                }
            }
        }
        return matrix[b.length][a.length];
    })(longer, shorter);

    return Math.round(((longerLength - distance) / longerLength) * 100);
}

function startListening(soal) {
    if (!recognition) return alert("Browser tidak mendukung Speech Recognition");

    const userTranscriptUI = document.getElementById('userTranscript');
    const correctAnswerUI = document.getElementById('correctAnswer');
    const scoreUI = document.getElementById('similarityScore');
    const idealRow = document.getElementById('idealAnswerRow');
    const scoreRow = document.getElementById('scoreRow');
    const statusPulse = document.getElementById('statusPulse');

    // Reset UI
    userTranscriptUI.innerText = "Sebutkan jawaban...";
    idealRow.classList.add('hidden');
    scoreRow.classList.add('hidden');
    statusPulse.classList.remove('hidden');

    recognition.start();

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        userTranscriptUI.innerText = `"${result}"`;
        
        if (event.results[0].isFinal) {
            statusPulse.classList.add('hidden');
            document.getElementById('voiceStatus').innerText = "Analisis Selesai";
            
            // Hitung Skor
            const score = getSimilarity(result, soal.fullAnswer);
            
            // Tampilkan Hasil Akhir
            correctAnswerUI.innerText = soal.fullAnswer;
            scoreUI.innerText = score + "%";
            
            idealRow.classList.remove('hidden');
            scoreRow.classList.remove('hidden');
            
            // Beri warna berdasarkan skor
            scoreUI.className = `text-4xl font-black ${score > 70 ? 'text-emerald-600' : 'text-orange-500'}`;
        }
    };
