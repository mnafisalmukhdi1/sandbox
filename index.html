<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Code Editor - Standalone</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel untuk menjalankan JSX di Browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        textarea { tab-size: 4; font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Import Firebase SDK via ESM CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // Inisialisasi Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'standalone-editor';

        const { useState, useEffect, useRef, useCallback } = React;

        const App = () => {
            const [html, setHtml] = useState('<h1>Halo dari GitHub Pages!</h1>\n<p>Edit kode ini lalu klik RUN.</p>');
            const [css, setCss] = useState('body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }\nh1 { color: #2563eb; }');
            const [js, setJs] = useState('console.log("Aplikasi Berjalan!");\n\n// Coba gunakan console.log di sini');
            const [output, setOutput] = useState('');
            const [activeTab, setActiveTab] = useState('html');
            const [logs, setLogs] = useState([]);
            const [isSaving, setIsSaving] = useState(false);
            const [user, setUser] = useState(null);
            const [shareStatus, setShareStatus] = useState(null);

            // Perbaikan Icon: Gunakan key unik untuk memaksa re-render aman
            const Icon = ({ name, size = 16, className = "" }) => {
                useEffect(() => {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }, [name, shareStatus, activeTab]);
                
                return (
                    <span className={`inline-flex items-center justify-center ${className}`}>
                        <i data-lucide={name} style={{ width: size, height: size }}></i>
                    </span>
                );
            };

            // 1. Logika Autentikasi
            useEffect(() => {
                const performSignIn = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (err) {
                        console.error("Auth error:", err);
                    }
                };
                performSignIn();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. Memuat Data dari URL
            useEffect(() => {
                const loadData = async () => {
                    const params = new URLSearchParams(window.location.search);
                    const id = params.get('id');
                    if (id && user) {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'snippets', id);
                            const snap = await getDoc(docRef);
                            if (snap.exists()) {
                                const data = snap.data();
                                setHtml(data.html || ''); 
                                setCss(data.css || ''); 
                                setJs(data.js || '');
                                // Trigger run secara manual setelah state terupdate
                                runCode(data.html, data.css, data.js);
                            }
                        } catch (e) { 
                            console.error("Gagal memuat snippet:", e); 
                        }
                    }
                };
                if (user) loadData();
            }, [user]);

            const runCode = useCallback((h = html, c = css, j = js) => {
                setLogs([]);
                const combined = `
                    <!DOCTYPE html>
                    <html>
                        <head>
                            <meta charset="UTF-8">
                            <style>${c}</style>
                        </head>
                        <body>
                            ${h}
                            <script>
                                const originalLog = console.log;
                                console.log = (...args) => {
                                    window.parent.postMessage({ 
                                        type: 'log', 
                                        content: args.map(a => {
                                            try {
                                                return typeof a === 'object' ? JSON.stringify(a) : String(a);
                                            } catch(e) { return "[Object]"; }
                                        }).join(' ') 
                                    }, '*');
                                    originalLog.apply(console, args);
                                };
                                window.onerror = (msg) => console.log("Error: " + msg);
                                try { 
                                    ${j} 
                                } catch (e) { 
                                    console.log("Runtime Error: " + e.message); 
                                }
                            <\/script>
                        </body>
                    </html>
                `;
                setOutput(combined);
            }, [html, css, js]);

            const handleSave = async () => {
                if (!user || isSaving) return;
                setIsSaving(true);
                setShareStatus(null);
                const id = crypto.randomUUID().split('-')[0];
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'snippets', id), {
                        html, css, js, userId: user.uid, createdAt: Date.now()
                    });
                    
                    const url = new URL(window.location.href);
                    url.searchParams.set('id', id);
                    window.history.pushState({}, '', url.toString());
                    
                    // Salin ke clipboard
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(url.toString());
                    } else {
                        const textArea = document.createElement("textarea");
                        textArea.value = url.toString();
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    
                    setShareStatus('success');
                    setTimeout(() => setShareStatus(null), 3000);
                } catch (e) { 
                    console.error("Simpan gagal:", e);
                    setShareStatus('error'); 
                } finally {
                    setIsSaving(false);
                }
            };

            // Menangani log dari iframe dengan pembersihan memori
            useEffect(() => {
                const handler = (e) => {
                    if (e.data && e.data.type === 'log') {
                        setLogs(p => [...p.slice(-99), { id: Math.random().toString(36), text: e.data.content }]);
                    }
                };
                window.addEventListener('message', handler);
                return () => window.removeEventListener('message', handler);
            }, []);

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-slate-100 font-sans">
                    <header className="flex items-center justify-between px-6 py-3 bg-slate-800 border-b border-slate-700 shadow-lg z-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-1.5 rounded-lg">
                                <Icon name="code" className="text-white" size={20} />
                            </div>
                            <h1 className="text-lg font-bold tracking-tight">Cloud Code Editor</h1>
                        </div>
                        <div className="flex gap-3">
                            <button 
                                onClick={handleSave} 
                                disabled={isSaving} 
                                className={`flex items-center gap-2 px-4 py-2 rounded-md font-medium text-sm transition-all shadow-sm ${
                                    shareStatus === 'success' 
                                    ? 'bg-emerald-600 text-white' 
                                    : 'bg-slate-700 hover:bg-slate-600 text-slate-200 disabled:opacity-50'
                                }`}
                            >
                                <Icon name={isSaving ? "loader-2" : (shareStatus === 'success' ? "check" : "share-2")} className={isSaving ? "animate-spin" : ""} size={16} />
                                {isSaving ? 'Menyimpan...' : (shareStatus === 'success' ? 'Link Disalin!' : 'Simpan & Share')}
                            </button>
                            <button 
                                onClick={() => runCode()} 
                                className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-md font-bold text-sm transition-all shadow-lg active:scale-95 text-white"
                            >
                                <Icon name="play" size={16} /> RUN
                            </button>
                        </div>
                    </header>

                    <main className="flex flex-1 overflow-hidden">
                        <div className="w-1/2 flex flex-col border-r border-slate-700 bg-slate-900">
                            <div className="flex bg-slate-800/40 px-2 pt-2 border-b border-slate-800">
                                {['html', 'css', 'js'].map(t => (
                                    <button 
                                        key={t} 
                                        onClick={() => setActiveTab(t)} 
                                        className={`px-6 py-2 text-xs font-bold uppercase rounded-t-md transition-all ${
                                            activeTab === t 
                                            ? 'bg-slate-900 text-blue-400 border-t-2 border-blue-500' 
                                            : 'text-slate-500 hover:text-slate-300'
                                        }`}
                                    >
                                        {t === 'js' ? 'JavaScript' : t.toUpperCase()}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 relative overflow-hidden">
                                <textarea
                                    key={`editor-${activeTab}`}
                                    value={activeTab === 'html' ? html : activeTab === 'css' ? css : js}
                                    onChange={e => {
                                        const v = e.target.value;
                                        if(activeTab === 'html') setHtml(v); 
                                        else if(activeTab === 'css') setCss(v); 
                                        else setJs(v);
                                    }}
                                    className="w-full h-full bg-transparent p-6 font-mono text-sm outline-none resize-none text-slate-300 leading-relaxed"
                                    spellCheck="false"
                                    placeholder={`Masukkan kode ${activeTab} Anda...`}
                                />
                            </div>
                        </div>

                        <div className="w-1/2 flex flex-col bg-white">
                            <div className="flex-1 relative bg-slate-50">
                                {output ? (
                                    <iframe 
                                        key={output.length}
                                        srcDoc={output} 
                                        className="w-full h-full border-none shadow-inner bg-white" 
                                        title="Preview"
                                    />
                                ) : (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400 gap-4">
                                        <Icon name="monitor" size={48} className="opacity-20" />
                                        <p className="text-sm font-medium">Klik RUN untuk melihat hasil</p>
                                    </div>
                                )}
                            </div>
                            
                            <div className="h-1/3 bg-slate-900 border-t border-slate-700 flex flex-col font-mono text-xs overflow-hidden">
                                <div className="bg-slate-800 px-4 py-2 flex justify-between items-center text-slate-400 border-b border-slate-700 shrink-0">
                                    <div className="flex items-center gap-2 uppercase tracking-widest text-[10px] font-bold">
                                        <Icon name="terminal" size={12} /> Console
                                    </div>
                                    <button onClick={() => setLogs([])} className="hover:text-white text-[10px]">CLEAR</button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 space-y-1 bg-slate-950/50">
                                    {logs.length === 0 ? (
                                        <div className="text-slate-700 italic">No logs...</div>
                                    ) : (
                                        logs.map(l => (
                                            <div key={l.id} className="flex gap-2 text-emerald-400">
                                                <span className="text-slate-600">[{new Date().toLocaleTimeString([], {hour12: false})}]</span>
                                                <span className="text-blue-400 font-bold">&gt;</span>
                                                <span className="break-all">{l.text}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    <footer className="bg-slate-800 border-t border-slate-700 px-4 py-1 text-[10px] text-slate-500 flex justify-between">
                        <span>Status: {user ? 'Connected' : 'Connecting...'}</span>
                        <span>Cloud Code Editor v1.0.2</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
