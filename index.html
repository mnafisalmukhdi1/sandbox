<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Code Editor - Standalone</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel untuk menjalankan JSX di Browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        textarea { tab-size: 4; font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        /** * PENTING: Masukkan konfigurasi Firebase Anda di sini agar bisa jalan di GitHub Pages.
         * Anda bisa mendapatkannya di Firebase Console > Project Settings.
         */
        const myCustomConfig = {
            apiKey: "AIzaSyCEhuUpa6ie9TOe3rXs8xw-4KdocApEQ6o",
            authDomain: "sandbox-nafis.firebaseapp.com",
            projectId: "sandbox-nafis",
            storageBucket: "sandbox-nafis.firebasestorage.app",
            messagingSenderId: "500139016936",
            appId: "1:500139016936:web:f5740ef05108b924163f5d",
            measurementId: "G-4GCZLE15Z3"
        };

        // Logika pemilihan config (Gunakan internal env jika ada, jika tidak gunakan custom)
        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' 
                ? JSON.parse(__firebase_config) 
                : myCustomConfig;
        } catch (e) {
            firebaseConfig = myCustomConfig;
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'standalone-editor';

        const { useState, useEffect, useRef, useCallback } = React;

        const App = () => {
            const [html, setHtml] = useState('<h1>Halo dari GitHub Pages!</h1>\n<p>Edit kode ini lalu klik RUN.</p>');
            const [css, setCss] = useState('body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }\nh1 { color: #2563eb; }');
            const [js, setJs] = useState('console.log("Aplikasi Berjalan!");');
            const [output, setOutput] = useState('');
            const [activeTab, setActiveTab] = useState('html');
            const [logs, setLogs] = useState([]);
            const [isSaving, setIsSaving] = useState(false);
            const [user, setUser] = useState(null);
            const [shareStatus, setShareStatus] = useState(null);

            const Icon = ({ name, size = 16, className = "" }) => {
                useEffect(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, [name, shareStatus, activeTab]);
                return (
                    <span className={`inline-flex items-center justify-center ${className}`}>
                        <i data-lucide={name} style={{ width: size, height: size }}></i>
                    </span>
                );
            };

            useEffect(() => {
                const performSignIn = async () => {
                    try { await signInAnonymously(auth); } 
                    catch (err) { console.error("Firebase Auth Error: Pastikan Anonymous Auth aktif di Firebase Console.", err); }
                };
                performSignIn();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const loadData = async () => {
                    const params = new URLSearchParams(window.location.search);
                    const id = params.get('id');
                    if (id && user) {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'snippets', id);
                            const snap = await getDoc(docRef);
                            if (snap.exists()) {
                                const data = snap.data();
                                setHtml(data.html || ''); setCss(data.css || ''); setJs(data.js || '');
                                runCode(data.html, data.css, data.js);
                            }
                        } catch (e) { console.error("Gagal memuat data cloud:", e); }
                    }
                };
                if (user) loadData();
            }, [user]);

            const runCode = useCallback((h = html, c = css, j = js) => {
                setLogs([]);
                const combined = `
                    <!DOCTYPE html>
                    <html>
                        <head><style>${c}</style></head>
                        <body>
                            ${h}
                            <script>
                                const originalLog = console.log;
                                console.log = (...args) => {
                                    window.parent.postMessage({ 
                                        type: 'log', 
                                        content: args.map(a => JSON.stringify(a)).join(' ') 
                                    }, '*');
                                    originalLog.apply(console, args);
                                };
                                try { ${j} } catch (e) { console.log("Runtime Error: " + e.message); }
                            <\/script>
                        </body>
                    </html>
                `;
                setOutput(combined);
            }, [html, css, js]);

            const handleSave = async () => {
                if (!user || isSaving) return;
                setIsSaving(true);
                const id = crypto.randomUUID().split('-')[0];
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'snippets', id), {
                        html, css, js, userId: user.uid, createdAt: Date.now()
                    });
                    const url = new URL(window.location.href);
                    url.searchParams.set('id', id);
                    window.history.pushState({}, '', url.toString());
                    await navigator.clipboard.writeText(url.toString());
                    setShareStatus('success');
                    setTimeout(() => setShareStatus(null), 3000);
                } catch (e) { setShareStatus('error'); }
                setIsSaving(false);
            };

            useEffect(() => {
                const handler = (e) => {
                    if (e.data && e.data.type === 'log') {
                        setLogs(p => [...p.slice(-50), { id: Math.random(), text: e.data.content }]);
                    }
                };
                window.addEventListener('message', handler);
                return () => window.removeEventListener('message', handler);
            }, []);

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-slate-100 font-sans">
                    <header className="flex items-center justify-between px-6 py-3 bg-slate-800 border-b border-slate-700 shadow-lg">
                        <div className="flex items-center gap-3">
                            <Icon name="code" className="text-blue-400" size={24} />
                            <h1 className="text-lg font-bold">Cloud Editor</h1>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleSave} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium ${shareStatus === 'success' ? 'bg-emerald-600' : 'bg-slate-700 hover:bg-slate-600'}`}>
                                <Icon name={isSaving ? "loader-2" : (shareStatus === 'success' ? "check" : "share-2")} className={isSaving ? "animate-spin" : ""} />
                                {shareStatus === 'success' ? 'Link Disalin!' : 'Simpan'}
                            </button>
                            <button onClick={() => runCode()} className="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-md font-bold text-sm shadow-lg transition-transform active:scale-95">
                                <Icon name="play" className="mr-2" /> RUN
                            </button>
                        </div>
                    </header>

                    <main className="flex flex-1 overflow-hidden">
                        <div className="w-1/2 flex flex-col border-r border-slate-700">
                            <div className="flex bg-slate-800/40 px-2 pt-2 border-b border-slate-800">
                                {['html', 'css', 'js'].map(t => (
                                    <button key={t} onClick={() => setActiveTab(t)} className={`px-6 py-2 text-xs font-bold uppercase rounded-t-md ${activeTab === t ? 'bg-slate-900 text-blue-400 border-t-2 border-blue-500' : 'text-slate-500'}`}>
                                        {t}
                                    </button>
                                ))}
                            </div>
                            <textarea
                                value={activeTab === 'html' ? html : activeTab === 'css' ? css : js}
                                onChange={e => activeTab === 'html' ? setHtml(e.target.value) : activeTab === 'css' ? setCss(e.target.value) : setJs(e.target.value)}
                                className="flex-1 bg-transparent p-6 font-mono text-sm outline-none resize-none text-slate-300"
                                spellCheck="false"
                            />
                        </div>
                        <div className="w-1/2 flex flex-col bg-white">
                            <div className="flex-1 bg-slate-50">
                                {output ? <iframe srcDoc={output} className="w-full h-full border-none" /> : <div className="h-full flex items-center justify-center text-slate-400">Klik RUN</div>}
                            </div>
                            <div className="h-1/3 bg-slate-950 p-4 font-mono text-xs overflow-auto">
                                <div className="text-slate-500 mb-2 border-b border-slate-800 pb-1">CONSOLE</div>
                                {logs.map(l => <div key={l.id} className="text-emerald-400 mb-1">{'>'} {l.text}</div>)}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
