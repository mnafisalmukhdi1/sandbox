<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner Keberuntungan Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: auto;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            z-index: 5;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 4px solid #3b82f6;
        }
        textarea {
            resize: none;
        }
        .btn-preset {
            transition: all 0.2s;
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid transparent;
        }
        .btn-preset:hover {
            transform: translateX(4px);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Bagian Input Nama & Presets -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 order-2 lg:order-1">
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Pengaturan Daftar</h2>
            
            <!-- Tombol Preset -->
            <div class="mb-6">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-bold">Pilih Preset:</p>
                <div class="flex flex-col gap-2">
                    <button onclick="loadPreset('ibadah')" class="btn-preset bg-blue-50 text-blue-700 border-blue-100 hover:bg-blue-100">
                        📖 Bacaan Ibadah
                    </button>
                    <button onclick="loadPreset('surah')" class="btn-preset bg-emerald-50 text-emerald-700 border-emerald-100 hover:bg-emerald-100">
                        🌙 Surah Pendek
                    </button>
                    <button id="btnCustom" onclick="loadCustom()" class="btn-preset bg-purple-50 text-purple-700 border-purple-100 hover:bg-purple-100 hidden">
                        ✨ Daftar Kustom Saya
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-sm text-gray-500 mb-2 block font-medium">Input Manual (satu per baris):</label>
                    <textarea id="nameInput" class="w-full h-48 p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm leading-relaxed" placeholder="Masukkan nama atau item..."></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="updateButton" class="bg-gray-800 text-white py-2 rounded-lg hover:bg-black transition text-sm font-bold">
                        Terapkan
                    </button>
                    <button id="saveCustomButton" class="bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition text-sm font-bold">
                        Simpan Kustom
                    </button>
                </div>
                <p id="saveStatus" class="text-center text-xs text-emerald-600 font-medium h-4"></p>
            </div>
        </div>

        <!-- Bagian Roda -->
        <div class="lg:col-span-2 flex flex-col items-center order-1 lg:order-2">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="center-circle"></div>
                <canvas id="wheelCanvas"></canvas>
            </div>
            
            <div class="flex flex-col items-center gap-4 mt-8">
                <button id="spinButton" class="px-12 py-4 bg-blue-600 text-white text-2xl font-bold rounded-full hover:bg-blue-700 active:scale-95 transition-all shadow-xl">
                    PUTAR!
                </button>
                <p class="text-gray-400 text-sm italic">Klik "Terapkan" jika daftar diubah manual</p>
            </div>
        </div>

    </div>

    <!-- Modal Pemenang -->
    <div id="winnerModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform transition-all scale-90 border-4 border-blue-100">
            <div class="mb-2">🎉</div>
            <h3 class="text-lg text-gray-400 font-bold uppercase tracking-widest">Terpilih:</h3>
            <div id="winnerName" class="text-4xl font-black text-blue-600 my-6 break-words leading-tight"></div>
            <button id="closeModal" class="w-full py-4 bg-blue-50 text-blue-700 font-bold rounded-2xl hover:bg-blue-100 transition border border-blue-200">
                Selesai
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const updateButton = document.getElementById('updateButton');
        const saveCustomButton = document.getElementById('saveCustomButton');
        const spinButton = document.getElementById('spinButton');
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameText = document.getElementById('winnerName');
        const closeModal = document.getElementById('closeModal');
        const btnCustom = document.getElementById('btnCustom');
        const saveStatus = document.getElementById('saveStatus');

        const presets = {
            ibadah: [
                "Niat Wudhu", "Doa Sesudah Wudhu", "Niat Subuh", "Niat Zuhur", 
                "Niat Ashar", "Niat Maghrib", "Niat Isya", "Doa Iftitah", 
                "Bacaan Rukuk", "Bacaan I'tidal", "Doa Qunut", "Bacaan Sujud", 
                "Bacaan Duduk di antara dua sujud", "Tahiyyat Akhir"
            ],
            surah: [
                "At-Takatsur", "Al-Asr", "Al-Humazah", "Al-Fil", 
                "Quraisy", "Al-Ma'un", "Al-Kautsar", "Al-Kafirun", 
                "An-Nasr", "Al-Lahab"
            ]
        };

        let names = [];
        let currentRotation = 0;
        let isSpinning = false;

        const colors = [
            '#ef4444', '#3b82f6', '#10b981', '#f59e0b', 
            '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'
        ];

        function init() {
            const size = 1000;
            canvas.width = size;
            canvas.height = size;
            
            // Cek data kustom di localStorage
            checkCustomStorage();
            
            // Load default preset
            loadPreset('ibadah');
        }

        function checkCustomStorage() {
            const saved = localStorage.getItem('spinner_custom_list');
            if (saved) {
                btnCustom.classList.remove('hidden');
            }
        }

        function loadPreset(key) {
            nameInput.value = presets[key].join('\n');
            drawWheel();
        }

        function loadCustom() {
            const saved = localStorage.getItem('spinner_custom_list');
            if (saved) {
                nameInput.value = saved;
                drawWheel();
            }
        }

        function saveToCustom() {
            const content = nameInput.value.trim();
            if (content) {
                localStorage.setItem('spinner_custom_list', content);
                btnCustom.classList.remove('hidden');
                saveStatus.innerText = "Daftar tersimpan!";
                setTimeout(() => saveStatus.innerText = "", 2000);
            }
        }

        function drawWheel() {
            names = nameInput.value.split('\n').filter(name => name.trim() !== '');
            if (names.length === 0) names = ["Kosong"];

            const sliceAngle = (2 * Math.PI) / names.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            names.forEach((name, i) => {
                const angle = i * sliceAngle;
                
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(500, 500);
                ctx.arc(500, 500, 500, angle, angle + sliceAngle);
                ctx.lineTo(500, 500);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();
                ctx.translate(500, 500);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                
                let fontSize = 35;
                if (names.length > 10) fontSize = 28;
                if (names.length > 20) fontSize = 22;
                if (names.length > 30) fontSize = 16;
                
                ctx.font = `bold ${fontSize}px sans-serif`;
                const displayName = name.length > 20 ? name.substring(0, 17) + "..." : name;
                ctx.fillText(displayName, 470, fontSize/3);
                ctx.restore();
            });
        }

        function spin() {
            if (isSpinning || names.length === 0) return;

            isSpinning = true;
            spinButton.disabled = true;
            spinButton.classList.add('opacity-50', 'scale-95');

            // 5-10 full rotations + random angle
            const extraRotation = Math.floor(Math.random() * 3600) + 1800;
            currentRotation += extraRotation;
            
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinButton.disabled = false;
                spinButton.classList.remove('opacity-50', 'scale-95');

                const actualDegrees = currentRotation % 360;
                const sliceSize = 360 / names.length;
                // Offset 270 degrees because top pointer is at -90deg/270deg in canvas logic
                const winningIndex = Math.floor(((360 - actualDegrees + 270) % 360) / sliceSize);
                
                showWinner(names[winningIndex]);
            }, 5000);
        }

        function showWinner(name) {
            winnerNameText.innerText = name;
            winnerModal.classList.remove('hidden');
            winnerModal.classList.add('flex');
            setTimeout(() => {
                winnerModal.querySelector('div').classList.remove('scale-90');
                winnerModal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        updateButton.addEventListener('click', drawWheel);
        saveCustomButton.addEventListener('click', saveToCustom);
        spinButton.addEventListener('click', spin);
        closeModal.addEventListener('click', () => {
            winnerModal.classList.add('hidden');
            winnerModal.classList.remove('flex');
            winnerModal.querySelector('div').classList.add('scale-90');
        });

        window.onload = init;
    </script>
</body>
</html>
