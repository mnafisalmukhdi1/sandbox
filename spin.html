<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner Keberuntungan Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: auto;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            z-index: 5;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 4px solid #3b82f6;
        }
        textarea {
            resize: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Bagian Input Nama -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 order-2 lg:order-1">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Daftar Nama</h2>
            <p class="text-sm text-gray-500 mb-2">Masukkan satu nama per baris:</p>
            <textarea id="nameInput" class="w-full h-64 p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Contoh:&#10;Andi&#10;Budi&#10;Cici">Andi
Budi
Cici
Dedi
Euis
Fani</textarea>
            <button id="updateButton" class="w-full mt-4 bg-gray-800 text-white py-2 rounded-lg hover:bg-black transition shadow-md">
                Perbarui Roda
            </button>
        </div>

        <!-- Bagian Roda -->
        <div class="lg:col-span-2 flex flex-col items-center order-1 lg:order-2">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="center-circle"></div>
                <canvas id="wheelCanvas"></canvas>
            </div>
            
            <button id="spinButton" class="mt-8 px-12 py-4 bg-blue-600 text-white text-2xl font-bold rounded-full hover:bg-blue-700 active:scale-95 transition-all shadow-xl">
                PUTAR!
            </button>
        </div>

    </div>

    <!-- Modal Pemenang -->
    <div id="winnerModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform transition-all scale-90">
            <h3 class="text-lg text-gray-500 font-medium uppercase tracking-widest">Pemenangnya Adalah</h3>
            <div id="winnerName" class="text-4xl font-black text-blue-600 my-6 break-words"></div>
            <button id="closeModal" class="w-full py-3 bg-gray-100 text-gray-800 font-bold rounded-xl hover:bg-gray-200 transition">
                Tutup
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const updateButton = document.getElementById('updateButton');
        const spinButton = document.getElementById('spinButton');
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameText = document.getElementById('winnerName');
        const closeModal = document.getElementById('closeModal');

        let names = [];
        let currentRotation = 0;
        let isSpinning = false;

        const colors = [
            '#ef4444', '#3b82f6', '#10b981', '#f59e0b', 
            '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'
        ];

        function init() {
            // Set canvas resolution
            const size = 1000;
            canvas.width = size;
            canvas.height = size;
            drawWheel();
        }

        function drawWheel() {
            names = nameInput.value.split('\n').filter(name => name.trim() !== '');
            if (names.length === 0) names = ["?"];

            const sliceAngle = (2 * Math.PI) / names.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            names.forEach((name, i) => {
                const angle = i * sliceAngle;
                
                // Draw slice
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(500, 500);
                ctx.arc(500, 500, 500, angle, angle + sliceAngle);
                ctx.lineTo(500, 500);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;

                // Draw text
                ctx.save();
                ctx.translate(500, 500);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 40px sans-serif";
                // Truncate text if too long
                const displayName = name.length > 15 ? name.substring(0, 12) + "..." : name;
                ctx.fillText(displayName, 460, 15);
                ctx.restore();
            });
        }

        function spin() {
            if (isSpinning || names.length === 0) return;

            isSpinning = true;
            spinButton.disabled = true;
            spinButton.classList.add('opacity-50', 'cursor-not-allowed');

            // Random rotation between 2000 and 5000 degrees
            const extraRotation = Math.floor(Math.random() * 3600) + 2000;
            currentRotation += extraRotation;
            
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Calculate winner after animation ends (5 seconds)
            setTimeout(() => {
                isSpinning = false;
                spinButton.disabled = false;
                spinButton.classList.remove('opacity-50', 'cursor-not-allowed');

                // Normalize rotation to get the index
                const actualDegrees = currentRotation % 360;
                // Pointer is at the top (270 degrees in standard circle math)
                // We need to adjust based on how canvas draws (0 is right)
                const sliceSize = 360 / names.length;
                const winningIndex = Math.floor(((360 - actualDegrees + 270) % 360) / sliceSize);
                
                showWinner(names[winningIndex]);
            }, 5000);
        }

        function showWinner(name) {
            winnerNameText.innerText = name;
            winnerModal.classList.remove('hidden');
            winnerModal.classList.add('flex');
            // Small timeout for animation
            setTimeout(() => {
                winnerModal.querySelector('div').classList.remove('scale-90');
                winnerModal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        updateButton.addEventListener('click', drawWheel);
        spinButton.addEventListener('click', spin);
        closeModal.addEventListener('click', () => {
            winnerModal.classList.add('hidden');
            winnerModal.classList.remove('flex');
            winnerModal.querySelector('div').classList.add('scale-90');
        });

        window.onload = init;
    </script>
</body>
</html>
