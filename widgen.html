<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>WID Generator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 text-center w-80">
        
        <div id="capture-area" class="bg-white p-2">
            <div id="qr-wrapper" class="relative inline-block p-2 bg-white border border-gray-100 rounded-xl shadow-inner">
                <div id="qrcode"></div>
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-1 rounded-full border border-gray-200 shadow-sm">
                    <img src="https://nafis1.my.id/logo.png" alt="Logo" title="MNAM" class="w-10 h-10 object-contain" />
                </div>
            </div>

            <div class="mt-4">
                <h2 id="wid-result" class="text-xl font-mono font-bold text-gray-800">WID-MNAM-00-00000</h2>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100">
            <p class="text-xs text-gray-400 mb-2 font-bold uppercase tracking-widest">Works Identification</p>
            <input type="text" id="slug-input" placeholder="Masukkan slug karya" 
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center mb-3"
                   oninput="generateWID()">

            <button onclick="downloadWID()" class="w-full py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition flex items-center justify-center gap-2">
                <span class="material-icons text-sm">download</span> Download QR & ID
            </button>
        </div>
    </div>

    <script>
        const qrContainer = document.getElementById("qrcode");
        
        let qrcode = new QRCode(qrContainer, {
            width: 180, height: 180,
            correctLevel: QRCode.CorrectLevel.H,
            colorDark: "#1e293b"
        });

        function generateWID() {
            const slug = document.getElementById('slug-input').value.toLowerCase().trim() || "karya-anda";
            
            let hash = 0;
            for (let i = 0; i < slug.length; i++) {
                hash = ((hash << 5) - hash) + slug.charCodeAt(i);
                hash |= 0;
            }
            const seq = Math.abs(hash % 100000).toString().padStart(5, '0');
            const year = new Date().getFullYear().toString().slice(-2);
            const finalWID = `WID-MNAM-${year}-${seq}`;
            
            document.getElementById('wid-result').innerText = finalWID;
            qrcode.makeCode(`https://nafis1.my.id/works/${slug.replace(/\s+/g, '-')}.html`);
        }

        function downloadWID() {
            const element = document.getElementById("capture-area");
            const slug = document.getElementById('slug-input').value.toLowerCase().trim() || "karya-anda";
            
            html2canvas(element, {
                backgroundColor: "#ffffff",
                scale: 3,
                logging: false
            }).then(canvas => {
                const link = document.createElement("a");
                const widCode = document.getElementById('wid-result').innerText;
                // Nama file: WID-MNAM-26-XXXXX_slug-karya.png
                link.download = `${widCode}_${slug.replace(/\s+/g, '-')}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        generateWID();
    </script>
</body>
</html>
