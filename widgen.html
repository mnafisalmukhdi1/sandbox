<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>WID Generator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 text-center w-80">
        
        <div id="capture-area" class="bg-white">
            <div id="qr-wrapper" class="relative inline-block p-2 bg-white border border-gray-100 rounded-xl shadow-inner">
                <div id="qrcode"></div>
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-1 rounded-full border border-gray-200 shadow-sm">
                    <img src="https://nafis1.my.id/logo.png" alt="Logo" title="MNAM" class="w-10 h-10 object-contain" />
                </div>
            </div>

            <div class="mt-6">
                <p class="text-[10px] text-gray-400 font-bold tracking-[0.2em] uppercase">Works Identification</p>
                <h2 id="wid-result" class="text-xl font-mono font-bold text-gray-800 mt-1">WID-MNAM-26-00000</h2>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100">
            <input type="text" id="slug-input" placeholder="Masukkan slug (contoh: novel-saya)" 
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center mb-3"
                   oninput="generateWID()">
            
            <button onclick="generateWID()" class="w-full py-2 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded-lg transition flex items-center justify-center gap-2 mb-2">
                <span class="material-icons text-sm">refresh</span> Generate Baru
            </button>

            <button onclick="downloadWID()" class="w-full py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition flex items-center justify-center gap-2">
                <span class="material-icons text-sm">download</span> Download QR & ID
            </button>
        </div>
    </div>

    <script>
        const qrContainer = document.getElementById("qrcode");
        
        let qrcode = new QRCode(qrContainer, {
            width: 180, height: 180,
            correctLevel: QRCode.CorrectLevel.H,
            colorDark: "#1e293b"
        });

        function generateWID() {
            const slug = document.getElementById('slug-input').value || "karya-anda";
            const seq = Math.floor(Math.random() * 99999).toString().padStart(5, '0');
            const finalWID = `WID-MNAM-26-${seq}`;
            
            document.getElementById('wid-result').innerText = finalWID;
            qrcode.makeCode(`https://nafis1.my.id/works/${slug.toLowerCase().replace(/\s+/g, '-')}/`);
        }

        function downloadWID() {
            // Mengambil elemen spesifik saja
            const element = document.getElementById("capture-area");
            
            html2canvas(element, {
                backgroundColor: "#ffffff", // Memastikan background putih bersih
                scale: 2 // Meningkatkan resolusi gambar agar tidak pecah saat cetak
            }).then(canvas => {
                const link = document.createElement("a");
                // Mengambil teks dari elemen h2 yang benar
                const fileName = document.getElementById('wid-result').innerText;
                link.download = `${fileName}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        generateWID();
    </script>
</body>
</html>
